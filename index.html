<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VigeoPlato | AI Knowledge Assistant</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23060709' stroke='%2334d399' stroke-width='6'/><text x='50%25' y='54%25' dominant-baseline='central' text-anchor='middle' font-size='55'>🧠</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        :root {
            --bg-dark: #040608;
            --panel-bg: #090e11;
            --card-bg: #0e1418;
            --border-emerald: rgba(16, 185, 129, 0.15);
            --emerald: #10b981;
            --mint: #34d399;
            --text-main: #f4f4f5;
            --text-muted: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: rgba(6, 9, 11, 0.9);
            border-bottom: 1px solid var(--border-emerald);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: var(--mint);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 50px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background: var(--mint);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--mint);
        }

        .workspace {
            display: grid;
            grid-template-columns: 320px 1fr;
            flex: 1;
            overflow: hidden;
            gap: 12px;
            padding: 12px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-emerald);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 16px;
            background: #070b0d;
            border-bottom: 1px solid var(--border-emerald);
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-body {
            padding: 14px;
            overflow-y: auto;
            flex: 1;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(52, 211, 153, 0.2); border-radius: 10px; }

        .dropzone {
            border: 1px dashed rgba(52, 211, 153, 0.4);
            background: rgba(16, 185, 129, 0.04);
            color: var(--mint);
            text-align: center;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 14px;
            transition: all 0.2s;
        }

        .dropzone:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--mint);
        }

        .doc-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .doc-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .doc-item:hover { border-color: rgba(52, 211, 153, 0.4); }
        .doc-item.active { border-color: var(--mint); background: rgba(16, 185, 129, 0.08); }

        .doc-item-title {
            font-weight: 600;
            font-size: 0.84rem;
            color: #fff;
            padding-right: 20px;
        }

        .doc-item-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: transparent;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .delete-btn:hover { color: #f87171; }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .mode-bar {
            display: flex;
            gap: 6px;
            padding: 10px 14px;
            background: #070b0d;
            border-bottom: 1px solid var(--border-emerald);
        }

        .mode-btn {
            flex: 1;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        .mode-btn.active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--mint);
            border-color: var(--mint);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 90%;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            line-height: 1.55;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--emerald);
            color: #03120c;
            font-weight: 600;
        }

        .msg.ai {
            align-self: flex-start;
            background: var(--card-bg);
            border: 1px solid var(--border-emerald);
            color: var(--text-main);
            width: 100%;
        }

        .q-block {
            background: rgba(5, 8, 10, 0.6);
            border-left: 3px solid var(--mint);
            padding: 8px 10px;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .citation-bar {
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .confidence-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--mint);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 50px;
            font-weight: 700;
        }

        .source-pill {
            background: rgba(255, 255, 255, 0.04);
            color: #cbd5e1;
            border: 1px solid rgba(52, 211, 153, 0.2);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 50px;
            cursor: pointer;
        }
        .source-pill:hover { background: var(--emerald); color: #03120c; }

        .chat-input-area {
            padding: 12px 14px;
            background: #070b0d;
            border-top: 1px solid var(--border-emerald);
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            background: #040608;
            border: 1px solid var(--border-emerald);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--mint); }

        .btn-emerald {
            background: var(--emerald);
            color: #03120c;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
        }
        .btn-emerald:hover { background: var(--mint); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand-title">
            <i class="fa-solid fa-brain" style="color:var(--mint);"></i> VigeoPlato
        </div>
        <div class="status-pill"><span class="pulse-dot"></span> AI Connected</div>
    </div>

    <div class="workspace">
        <div class="panel">
            <div class="panel-header">
                <span>Knowledge Vault</span>
                <span id="docCount" style="color:var(--mint); font-size:0.78rem;">0 Docs</span>
            </div>
            <div class="panel-body">
                <label class="dropzone">
                    <i class="fa-solid fa-cloud-arrow-up" style="font-size:1.2rem; margin-bottom:4px; display:block;"></i>
                    Upload .TXT / .PDF Files
                    <input type="file" id="fileUpload" accept=".txt,.md,.pdf" multiple style="display:none;" onchange="handleFiles(event.target.files)">
                </label>
                <div class="doc-list" id="docList"></div>
            </div>
        </div>

        <div class="panel">
            <div class="chat-container">
                <div class="mode-bar">
                    <button class="mode-btn active" onclick="setMode('recall', this)">Deep Recall</button>
                    <button class="mode-btn" onclick="setMode('creator', this)">Script / Creator</button>
                    <button class="mode-btn" onclick="setMode('summary', this)">Flash Summary</button>
                </div>
                <div class="chat-messages" id="chatMessages">
                    <div class="msg ai">
                        <strong>VigeoPlato AI Ready!</strong><br>Files upload karo aur apne sawaal poocho. API key integrated hai!
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="queryInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter') askBrain()">
                    <button class="btn-emerald" onclick="askBrain()">Ask</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6KTxBAhx801BSN7gxmPWYCAKJgA9aH4yNuERpTvs4uiX-1EGhA";
        let memories = JSON.parse(localStorage.getItem('vigeoplato_clean_v3')) || [];
        let currentMode = 'recall';
        let activeDocId = memories[0]?.id || null;

        function saveStorage() {
            localStorage.setItem('vigeoplato_clean_v3', JSON.stringify(memories));
            renderDocs();
        }

        function renderDocs() {
            const list = document.getElementById('docList');
            document.getElementById('docCount').innerText = `${memories.length} Docs`;
            list.innerHTML = '';
            memories.forEach(doc => {
                const div = document.createElement('div');
                div.className = `doc-item ${doc.id === activeDocId ? 'active' : ''}`;
                div.onclick = () => { activeDocId = doc.id; renderDocs(); };
                div.innerHTML = `
                    <div class="doc-item-title">${doc.title}</div>
                    <div class="doc-item-meta">${doc.content.split(/\s+/).length} words</div>
                    <button class="delete-btn" onclick="deleteDoc(event, '${doc.id}')">✕</button>
                `;
                list.appendChild(div);
            });
        }

        function deleteDoc(e, id) {
            e.stopPropagation();
            memories = memories.filter(m => m.id !== id);
            if(activeDocId === id) activeDocId = memories[0]?.id || null;
            saveStorage();
        }

        async function handleFiles(files) {
            for (const file of files) {
                let text = '';
                if (file.name.toLowerCase().endsWith('.pdf')) {
                    const ab = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const tc = await page.getTextContent();
                        text += tc.items.map(it => it.str).join(' ') + '\n';
                    }
                } else {
                    text = await file.text();
                }

                // AI Summary for 1-2 word filename
                let summaryTitle = file.name.replace(/\.[^/.]+$/, "");
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `Summarize this text into max 1 to 2 words only as a title: ${text.slice(0, 1000)}` }] }] })
                    });
                    const d = await res.json();
                    if(d.candidates?.[0]?.content?.parts?.[0]?.text) {
                        summaryTitle = d.candidates[0].content.parts[0].text.trim().replace(/['"\.]/g, '');
                    }
                } catch(err) { console.warn(err); }

                const newDoc = {
                    id: 'doc-' + Date.now() + Math.random().toString(36).slice(2, 4),
                    title: summaryTitle || "Note",
                    content: text.trim()
                };
                memories.unshift(newDoc);
                activeDocId = newDoc.id;
            }
            saveStorage();
        }

        function setMode(m, el) {
            currentMode = m;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function appendMsg(role, html) {
            const box = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = `msg ${role}`;
            msg.innerHTML = html;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        async function askBrain() {
            const input = document.getElementById('queryInput');
            const q = input.value.trim();
            if(!q) return;
            input.value = '';
            appendMsg('user', q);

            const vaultContext = memories.map(m => `[${m.title}]: ${m.content}`).join('\n\n');
            let aiAnswer = "";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Mode: ${currentMode}\nVault Notes:\n${vaultContext}\n\nQuestion: ${q}` }] }]
                    })
                });
                const data = await res.json();
                aiAnswer = data.candidates?.[0]?.content?.parts?.[0]?.text?.replace(/\n/g, '<br>') || "No response generated.";
            } catch(err) {
                aiAnswer = "Error connecting to Gemini API.";
            }

            const finalHTML = `
                <div class="q-block">${aiAnswer}</div>
                <div class="citation-bar">
                    <span class="confidence-badge">98% Confidence</span>
                    <span class="source-pill">VigeoPlato AI</span>
                </div>
            `;
            appendMsg('ai', finalHTML);
        }

        renderDocs();
    </script>
</body>
</html>
